name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The current Home Assistant, and the minimum declared in hacs.json.
        requirements: [requirements_test.txt, requirements_test_min.txt]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: '3.14'
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: requirements_test*.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: uv pip install -r ${{ matrix.requirements }}
      - run: bash scripts/check.sh
      - name: Build integration package
        run: python scripts/build_release.py
      - name: Validate integration package and bundled card
        run: python scripts/validate_release.py
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uvx ruff@0.17.3 check .
      - run: uvx ruff@0.17.3 format --check .
  hassfest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master
  hacs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: hacs/action@main
        with:
          category: integration
