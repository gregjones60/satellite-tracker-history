name: Release
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions:
  contents: write
concurrency:
  group: release-main
  cancel-in-progress: false
jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install pytest pytest-asyncio voluptuous
      - name: Choose next patch version
        id: version
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from build_release import next_release_version
          current=json.loads(Path('custom_components/spot_trace_history/manifest.json').read_text())['version']
          tags=subprocess.check_output(['git', 'tag', '--list'], text=True).splitlines()
          version=next_release_version(current, tags)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
              output.write(f'tag=v{version}\n')
          PY
      - name: Protect existing version tags
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          script: |
            const checkReleaseTag = require('./.github/scripts/check-release-tag.cjs');
            await checkReleaseTag({github, context, core,
              tag: process.env.RELEASE_TAG, testedSha: process.env.TESTED_SHA});
      - name: Build versioned release
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: python scripts/build_release.py --version "$TAG"
      - run: bash scripts/check.sh
      - name: Save release version to main
        id: commit
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/spot_trace_history/manifest.json package.json README.md
          git commit -m "Release v${RELEASE_VERSION} [skip ci]"
          git push origin HEAD:main
          git rev-parse HEAD | sed 's/^/sha=/' >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ steps.commit.outputs.sha }}
          files: dist/spot_trace_history-${{ steps.version.outputs.version }}.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
