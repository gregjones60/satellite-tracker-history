name: Release
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions:
  contents: write
jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install pytest pytest-asyncio voluptuous
      - name: Read release version
        id: version
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          version=json.loads(Path('custom_components/spot_trace_history/manifest.json').read_text())['version']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
              output.write(f'tag=v{version}\n')
          PY
      - name: Protect existing version tags
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          script: |
            const checkReleaseTag = require('./.github/scripts/check-release-tag.cjs');
            await checkReleaseTag({github, context, core,
              tag: process.env.RELEASE_TAG, testedSha: process.env.TESTED_SHA});
      - name: Build versioned release
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: python scripts/build_release.py --version "$TAG"
      - run: bash scripts/check.sh
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          files: dist/spot_trace_history-${{ steps.version.outputs.version }}.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
