name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install pytest pytest-asyncio voluptuous
      - run: bash scripts/check.sh
      - name: Verify tag matches manifest
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          version=json.loads(Path('custom_components/spot_trace_history/manifest.json').read_text())['version']
          assert os.environ['TAG'] == 'v'+version, f"Tag must be v{version}"
          PY
      - run: python scripts/build_release.py
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
