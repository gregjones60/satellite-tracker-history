name: Release
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: release-main
  cancel-in-progress: false
jobs:
  changes:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shipped: ${{ steps.diff.outputs.shipped }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Check for changes HACS would install
        id: diff
        run: |
          latest=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          if [ -z "$latest" ] || ! git diff --quiet "$latest" HEAD -- custom_components hacs.json; then
            echo 'shipped=true' >> "$GITHUB_OUTPUT"
          else
            echo "Nothing shipped has changed since $latest; not releasing."
            echo 'shipped=false' >> "$GITHUB_OUTPUT"
          fi
  release:
    needs: changes
    if: needs.changes.outputs.shipped == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # CI has tested this commit. Nothing from PyPI is installed here, so no
    # third-party package runs with this write token.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Choose next patch version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from build_release import next_release_version
          current=json.loads(Path('custom_components/satellite_tracker_history/manifest.json').read_text())['version']
          tags=subprocess.check_output(['git', 'tag', '--list'], text=True).splitlines()
          releases=subprocess.check_output(['gh','api','--paginate',f"repos/{os.environ['GITHUB_REPOSITORY']}/releases",'--jq','.[].tag_name'],text=True).splitlines()
          version=next_release_version(current, tags + releases)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
              output.write(f'tag=v{version}\n')
          PY
      - name: Protect existing version tags
        uses: actions/github-script@v9
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          script: |
            const checkReleaseTag = require('./.github/scripts/check-release-tag.cjs');
            await checkReleaseTag({github, context, core,
              tag: process.env.RELEASE_TAG, testedSha: process.env.TESTED_SHA});
      - name: Build versioned release
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: python scripts/build_release.py --version "$TAG"
      - name: Validate version metadata
        run: python scripts/validate_package.py
      - name: Validate release package and bundled card
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: python scripts/validate_release.py --version "$RELEASE_VERSION"
      - name: Save release version to main
        id: commit
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/satellite_tracker_history/manifest.json package.json README.md
          # A version set by hand is already on main, so there may be nothing to save;
          # the release is then tagged at the tested commit itself.
          if ! git diff --cached --quiet; then
            git commit -m "Release v${RELEASE_VERSION} [skip ci]"
            git push origin HEAD:main
          fi
          git rev-parse HEAD | sed 's/^/sha=/' >> "$GITHUB_OUTPUT"
      - name: Create release tag at the validated commit
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          git tag "$RELEASE_TAG" "$RELEASE_SHA"
          git push origin "refs/tags/$RELEASE_TAG"
          python scripts/validate_release.py --version "${RELEASE_TAG#v}" --ref "$RELEASE_TAG"
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ steps.commit.outputs.sha }}
          files: dist/satellite_tracker_history-${{ steps.version.outputs.version }}.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
      - name: Verify published tag commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          actual_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)
          test "$actual_sha" = "$RELEASE_SHA"
